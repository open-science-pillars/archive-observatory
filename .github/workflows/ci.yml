name: observatory-ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Selftests
        run: |
          uv run tools/sweep_providers.py data/requirements-seed.yaml --selftest
          uv run tools/quarc_attest.py --selftest
      - name: Credential-free invariant (red-team R10)
        # Scope excludes this file: the pattern string would match its
        # own definition line. The workflow dir is still scanned.
        run: |
          ! grep -rniE "netrc|earthdata_login|EDL_|Authorization: Bearer|api[_-]?key" \
            tools/ data/ .github/workflows/ --exclude=ci.yml \
            --include="*.py" --include="*.yml" --include="*.yaml"
      - name: Red-team verdict present on PRs
        if: github.event_name == 'pull_request'
        run: test -f redteam-verdict.md
