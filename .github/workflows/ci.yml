name: observatory-ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Selftests
        run: |
          uv run tools/sweep_providers.py data/requirements-seed.yaml --selftest
          uv run tools/quarc_attest.py --selftest
          uv run tools/make_badge.py --selftest
          uv run tools/fitness_attest.py --selftest
          uv run tools/seed_check.py --selftest
      - name: Credential-free invariant (red-team R10)
        # Tree-wide, all file types, all register patterns including
        # token. Excluded: this file and RED-TEAM.md, whose pattern
        # definitions self-match, and reviews/, whose verdicts quote
        # attack language as data.
        run: |
          ! grep -rniE "netrc|earthdata_login|EDL_|Authorization: Bearer|api[_-]?key|token" \
            . --exclude-dir=.git --exclude-dir=reviews \
            --exclude=ci.yml --exclude=RED-TEAM.md
      - name: Red-team verdict bound to this PR (red-team R9)
        if: github.event_name == 'pull_request'
        run: test -f "reviews/pr-${{ github.event.pull_request.number }}-redteam-verdict.md"
  seed-agrees-with-concepts:
    # The esdis requirement concepts are the authority for the rules
    # seed (red-team R2). The public knowledge repository is checked
    # out beside this one, in a job of its own so its tree never sits
    # under the credential grep above, and the seed is compared with
    # the concepts field by field. No secrets, no login: a public
    # read-only checkout and a tool that reads disk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # Pinned to a release tag of the knowledge repository, never a
        # branch (red-team R13): both steps below execute code from
        # this checkout, so what runs here is decided by a commit in
        # this repository, not by whatever lands upstream. The pin
        # moves in a PR of its own that names the release and re-runs
        # the seed check against it. nasa-daac-knowledge--v2026.9.2 is
        # commit c6827f6.
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          ref: nasa-daac-knowledge--v2026.9.2
          path: nasa-daac-knowledge
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Seed agrees with the esdis concepts (red-team R2)
        run: |
          uv run tools/seed_check.py data/requirements-seed.yaml \
            --concepts nasa-daac-knowledge/knowledge/esdis
      - name: Every script declares the dependencies it imports
        # The knowledge repository's checker, run from the same checkout:
        # each tool's PEP 723 header must cover its imports, so
        # `uv run tools/<script>` resolves on a fresh fork with nothing
        # installed but uv, which is the forkability R10 protects.
        run: uv run nasa-daac-knowledge/tools/check_script_deps.py tools
