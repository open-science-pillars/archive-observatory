name: observatory-ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Selftests
        run: |
          uv run tools/sweep_providers.py data/requirements-seed.yaml --selftest
          uv run tools/quarc_attest.py --selftest
          uv run tools/make_badge.py --selftest
          uv run tools/fitness_attest.py --selftest
          uv run tools/seed_check.py --selftest
          uv run tools/resolve_release.py --selftest
      - name: Credential-free invariant (red-team R10)
        # Tree-wide, all file types, all register patterns including
        # token. Excluded: this file and RED-TEAM.md, whose pattern
        # definitions self-match, and reviews/, whose verdicts quote
        # attack language as data.
        run: |
          ! grep -rniE "netrc|earthdata_login|EDL_|Authorization: Bearer|api[_-]?key|token" \
            . --exclude-dir=.git --exclude-dir=reviews \
            --exclude=ci.yml --exclude=RED-TEAM.md
      - name: Red-team verdict bound to this PR (red-team R9)
        if: github.event_name == 'pull_request'
        run: test -f "reviews/pr-${{ github.event.pull_request.number }}-redteam-verdict.md"
  seed-agrees-with-concepts:
    # The esdis requirement concepts are the authority for the rules
    # seed (red-team R2). The public knowledge repository is checked
    # out beside this one, in a job of its own so its tree never sits
    # under the credential grep above, and the seed is compared with
    # the concepts field by field. No secrets, no login: a public
    # read-only checkout and a tool that reads disk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Resolve the declared knowledge floor to its highest release
        # data/dependencies.yaml declares a version floor the way the
        # marketplace plugins do; the resolver lists the knowledge
        # repository's release tags (read-only, credential-free) and
        # picks the highest one that satisfies the floor, writing ref=
        # and commit= to the step outputs itself so no shell
        # substitution can swallow a failing exit (red-team R11).
        id: knowledge
        run: |
          uv run tools/resolve_release.py data/dependencies.yaml \
            nasa-daac-knowledge --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        # A release tag of the knowledge repository, never a branch
        # (red-team R13): the steps below execute code from this
        # checkout, so what runs here is a signed, tagged release chosen
        # by the floor this repository declares. A new release upstream
        # is measured against on the next run with no commit here; a
        # release that raises the floor raises it in data/dependencies.yaml.
        with:
          repository: open-science-pillars/nasa-daac-knowledge
          ref: ${{ steps.knowledge.outputs.ref }}
          path: nasa-daac-knowledge
          persist-credentials: false
      - name: Seed agrees with the esdis concepts (red-team R2)
        run: |
          uv run tools/seed_check.py data/requirements-seed.yaml \
            --concepts nasa-daac-knowledge/knowledge/esdis
      - name: Every script declares the dependencies it imports
        # The knowledge repository's checker, run from the same checkout:
        # each tool's PEP 723 header must cover its imports, so
        # `uv run tools/<script>` resolves on a fresh fork with nothing
        # installed but uv, which is the forkability R10 protects.
        run: uv run nasa-daac-knowledge/tools/check_script_deps.py tools
      - name: Wording rules (specification rules by name, no program bookkeeping, no dashes)
        # The knowledge repository's wording check, from the same release
        # checkout, over this tree: a specification rule is cited by its
        # name and never by a section number, program bookkeeping stays
        # out of what a reader meets, and no em or en dash. reviews/ is
        # excluded because a verdict quotes the text it judged, dated,
        # the way a bundle log does, and so is the knowledge checkout
        # itself, which sits inside this tree in CI and is gated by its
        # own release; this step measures this repository's prose and
        # nothing else. The tool's selftest runs first, so
        # a release whose check no longer catches what it claims fails
        # here before it is trusted over this tree; no pipe on either
        # line, each exit read by the step (R11).
        run: |
          uv run nasa-daac-knowledge/tools/check_prose.py --selftest
          uv run nasa-daac-knowledge/tools/check_prose.py . --exclude 'reviews/*' --exclude 'nasa-daac-knowledge/*'
